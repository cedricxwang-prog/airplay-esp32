<!DOCTYPE html><html><head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title data-zh="AirPlay 接收器" data-en="AirPlay Receiver">AirPlay 接收器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);min-height:100vh;padding:20px;color:#fff}
.wrap{max-width:480px;margin:0 auto}
.header{text-align:center;padding:30px 0}
.header h1{font-size:28px;font-weight:600;margin-bottom:8px}
.header p{color:#888;font-size:14px}
.status-bar{background:#0f3460;border-radius:12px;padding:16px;margin-bottom:20px;text-align:center}
.status-bar.ok{background:#1b4332}
.status-bar.err{background:#5c1a1a}
.card{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.1)}
.card h2{font-size:16px;font-weight:600;margin-bottom:16px;color:#e94560}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:#888;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
input[type=text],input[type=password]{width:100%;padding:12px 14px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-size:14px}
input:focus{outline:none;border-color:#e94560}
.btn{display:inline-block;padding:12px 20px;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.2s}
.btn-primary{background:#e94560;color:#fff}
.btn-primary:hover{background:#d63850}
.btn-secondary{background:rgba(255,255,255,0.1);color:#fff}
.btn-secondary:hover{background:rgba(255,255,255,0.2)}
.btn-danger{background:#dc3545;color:#fff}
.btn-danger:hover{background:#c82333}
.btn-block{width:100%;margin-top:10px}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.wifi-list{max-height:260px;overflow-y:auto;margin:12px 0;border-radius:8px}
.wifi-item{width:100%;padding:12px;background:rgba(0,0,0,0.2);margin-bottom:4px;border:1px solid transparent;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff;text-align:left;font:inherit}
.wifi-item:hover{background:rgba(233,69,96,0.2)}
.wifi-item.sel{background:rgba(233,69,96,0.3);border:1px solid #e94560}
.wifi-details{min-width:0}
.wifi-item .ssid{font-weight:500;display:block;overflow-wrap:anywhere}
.wifi-item .rssi{font-size:12px;color:#888;flex-shrink:0}
.wifi-meta{display:block;font-size:12px;color:#b5bdcc;margin-top:5px}
.wifi-connect-panel{padding:16px;border:1px solid #e94560;border-radius:10px;margin:14px 0}
.wifi-connect-panel h3{font-size:16px;margin-bottom:12px;overflow-wrap:anywhere}
.wifi-connect-panel input{font-size:16px}
.wifi-check{display:flex;gap:8px;align-items:center;margin:12px 0;font-size:13px}
.wifi-current{font-size:13px;color:#b5bdcc;overflow-wrap:anywhere;margin-bottom:12px}
.wifi-manual{margin:16px 0 0}
.wifi-manual summary{cursor:pointer;font-size:13px;color:#b5bdcc;margin-bottom:14px}
[hidden]{display:none!important}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-item{background:rgba(0,0,0,0.2);padding:12px;border-radius:8px}
.info-item label{font-size:11px;color:#888;display:block;margin-bottom:4px}
.info-item span{font-size:14px;font-weight:500}
.msg{padding:10px;border-radius:6px;margin-top:10px;font-size:13px}
.msg.ok{background:rgba(27,67,50,0.5)}
.msg.err{background:rgba(92,26,26,0.5)}
.msg.info{background:rgba(15,52,96,0.5)}
.file-row{display:flex;gap:10px;align-items:center}
.file-name{flex:1;font-size:13px;color:#888}
.actions{display:flex;gap:10px;margin-top:10px}
.slider-row{display:flex;align-items:center;gap:12px}
.slider-row input[type=range]{flex:1;accent-color:#e94560}
.slider-row span{font-size:13px;color:#888;min-width:32px;text-align:right}
</style></head><body>
<div class='wrap'>
<div class='header'><h1>AirPlay Receiver</h1><p>by Cedric</p><select id='ui-language' aria-label='Language / 语言'><option value='zh'>中文</option><option value='en'>English</option></select><p data-zh="ESP32 配置面板" data-en="ESP32 Configuration Panel">ESP32 配置面板</p></div>
<div id='status-bar' class='status-bar' data-zh="加载中…" data-en="Loading...">加载中…</div>
<div class='card'><h2 data-zh="WiFi 网络" data-en="WiFi Network">WiFi 网络</h2>
<p id='wifi-current' class='wifi-current'></p>
<div class='form-group'><label for='saved-wifi' data-zh='已保存的 WiFi' data-en='Saved WiFi'>已保存的 WiFi</label><select id='saved-wifi'></select></div>
<button class='btn btn-secondary' id='saved-wifi-connect' onclick='connectSavedWiFi()' disabled data-zh='连接已保存的 WiFi' data-en='Connect to saved WiFi'>连接已保存的 WiFi</button>
<button class='btn btn-secondary' id='wifi-scan' onclick='scanWiFi()' data-zh="扫描网络" data-en="Scan Networks">扫描网络</button>
<div id='wifi-list' class='wifi-list'></div>
<form id='wifi-connect-panel' class='wifi-connect-panel' hidden onsubmit='event.preventDefault();connectSelectedWiFi()'>
<h3 id='wifi-selected-name'></h3>
<p id='wifi-selected-hint' class='wifi-current'></p>
<label id='wifi-reuse-row' class='wifi-check' hidden><input type='checkbox' id='wifi-reuse' onchange='updateWiFiPasswordPanel()'><span data-zh='使用设备中保存的密码' data-en='Use password saved on this device'>使用设备中保存的密码</span></label>
<div id='wifi-selected-password-group' class='form-group'><label for='wifi-selected-password' data-zh='密码' data-en='Password'>密码</label><input type='password' id='wifi-selected-password' autocomplete='new-password' maxlength='64' data-placeholder-zh='输入此网络的密码' data-placeholder-en='Enter this network’s password' placeholder='输入此网络的密码'></div>
<div class='actions'><button type='submit' id='wifi-selected-connect' class='btn btn-primary' data-zh='连接' data-en='Connect'>连接</button><button type='button' id='wifi-selected-cancel' class='btn btn-secondary' onclick='closeWiFiPanel()' data-zh='取消' data-en='Cancel'>取消</button></div>
</form>
<details class='wifi-manual'><summary data-zh='隐藏网络 / 手动输入' data-en='Hidden network / Enter manually'>隐藏网络 / 手动输入</summary>
<div class='form-group'><label data-zh="网络名称" data-en="Network Name (SSID)">网络名称</label><input type='text' id='wifi-ssid' placeholder='输入或选择网络' data-placeholder-zh="输入或选择网络" data-placeholder-en="Enter or select network"></div>
<div class='form-group'><label data-zh="密码" data-en="Password">密码</label><input type='password' id='wifi-pass' placeholder='输入密码' data-placeholder-zh="输入密码" data-placeholder-en="Enter password"></div>
<button class='btn btn-primary btn-block' id='wifi-manual-connect' onclick='saveWiFi()' data-zh="连接 WiFi" data-en="Connect to WiFi">连接 WiFi</button></details>
<div id='wifi-msg'></div></div>
<div class='card'><h2 data-zh="设备设置" data-en="Device Settings">设备设置</h2>
<div class='form-group'><label data-zh="AirPlay 设备名称" data-en="AirPlay Device Name">AirPlay 设备名称</label><input type='text' id='dev-name' placeholder='我的音箱' data-placeholder-zh="我的音箱" data-placeholder-en="My Speaker"></div>
<button class='btn btn-primary' onclick='saveName()' data-zh="保存名称" data-en="Save Name">保存名称</button>
<div id='name-msg'></div>
<div class='form-group' style='margin-top:18px'><label for='airplay-icon' data-zh='AirPlay 图标' data-en='AirPlay Icon'>AirPlay 图标</label>
<select id='airplay-icon'><option value='2' data-zh='通用音箱（类似 Sonos）' data-en='Generic speaker (like Sonos)'>通用音箱（类似 Sonos）</option><option value='0' data-zh='HomePod mini（原默认）' data-en='HomePod mini (original default)'>HomePod mini（原默认）</option><option value='1' data-zh='电视 / Apple TV' data-en='TV / Apple TV'>电视 / Apple TV</option></select></div>
<p style='color:#888;font-size:12px' data-zh='通用音箱广播为第三方音箱；实际图案由 iOS/macOS 决定，保存后重启生效。' data-en='Generic speaker advertises a third-party speaker identity. iOS/macOS chooses the icon. Restart after saving.'>通用音箱广播为第三方音箱；实际图案由 iOS/macOS 决定，保存后重启生效。</p>
<button class='btn btn-secondary' onclick='saveIcon()' data-zh='保存图标' data-en='Save Icon'>保存图标</button><div id='icon-msg'></div>
<div class='form-group' style='margin-top:18px'><label for='led-brightness' data-zh="LED 亮度" data-en="LED Brightness">LED 亮度</label>
<div class='slider-row'><input type='range' id='led-brightness' min='0' max='255' value='128' oninput='document.getElementById("led-pct").textContent=Math.round(this.value/255*100)+"%"'>
<span id='led-pct'>50%</span></div></div>
<button class='btn btn-secondary' onclick='saveBrightness()' data-zh="保存亮度" data-en="Save Brightness">保存亮度</button>
<div id='brightness-msg'></div>
<div id='chan-group'>
<div class='form-group' style='margin-top:18px'><label for='chan-mode' id='chan-label' data-zh="输出声道" data-en="Output Channel">输出声道</label>
<select id='chan-mode' onchange='saveChannel()'>
<option value='0' data-zh="立体声" data-en="Stereo">立体声</option>
<option value='1' data-zh="仅左声道" data-en="Left only">仅左声道</option>
<option value='2' data-zh="仅右声道" data-en="Right only">仅右声道</option>
<option value='3' data-zh="单声道" data-en="Mono (L+R)">单声道</option>
</select></div>
<div id='chan-msg'></div></div>
<div id='dual-group' style='display:none;margin-top:18px'>
<div class='form-group'><label for='dual-mode' data-zh="DAC 配置" data-en="DAC Configuration">DAC 配置</label>
<select id='dual-mode' onchange='saveDual()'>
<option value='0'>2.1 模式（卫星箱/低音炮）· 2.1 (Satellites / Sub)</option>
<option value='1' data-zh="双功放" data-en="Bi-Amp">双功放</option>
</select></div>
<div id='dual-msg'></div></div>
<div id='eq-link' style='display:none;margin-top:18px'>
<a href='/eq' class='btn btn-secondary' data-zh="均衡器设置" data-en="EQ Settings">均衡器设置</a></div>
</div>
<div class='card'><h2 data-zh="固件升级" data-en="Firmware Update">固件升级</h2>
<p class='wifi-current' data-zh='选择应用 OTA BIN。新版固件包含 WebUI，升级后会核对固件与页面版本。' data-en='Choose an application OTA BIN. New firmware includes the WebUI; both versions are checked after updating.'>选择应用 OTA BIN。新版固件包含 WebUI，升级后会核对固件与页面版本。</p>
<div class='file-row'><input type='file' id='fw-file' accept='.bin' style='display:none'>
<button class='btn btn-secondary' id='fw-choose' onclick='document.getElementById("fw-file").click()' data-zh="选择文件" data-en="Choose File">选择文件</button>
<span class='file-name' id='fw-name' data-zh="未选择文件" data-en="No file selected">未选择文件</span></div>
<button class='btn btn-primary btn-block' id='ota-btn' onclick='startOTA()' disabled data-zh="上传固件" data-en="Upload Firmware">上传固件</button>
<div id='ota-msg' role='status' aria-live='polite'></div></div>
<div class='card'><h2 data-zh="系统信息" data-en="System">系统信息</h2>
<div class='info-grid'>
<div class='info-item'><label data-zh="IP 地址" data-en="IP Address">IP 地址</label><span id='info-ip'>-</span></div>
<div class='info-item'><label data-zh="MAC 地址" data-en="MAC Address">MAC 地址</label><span id='info-mac'>-</span></div>
<div class='info-item'><label data-zh="设备名称" data-en="Device Name">设备名称</label><span id='info-name'>-</span></div>
<div class='info-item'><label data-zh="可用内存" data-en="Free Memory">可用内存</label><span id='info-heap'>-</span></div>
<div class='info-item'><label data-zh="固件版本" data-en="Firmware">固件版本</label><span id='info-fw'>-</span></div>
<div class='info-item'><label data-zh="页面版本" data-en="WebUI">页面版本</label><span id='info-webui'>-</span></div>
<div class='info-item'><label data-zh="运行时间" data-en="Uptime">运行时间</label><span id='info-uptime'>-</span></div>
<div class='info-item'><label data-zh="上次重启" data-en="Last reset">上次重启</label><span id='info-reset'>-</span></div>
<div class='info-item'><label data-zh="WiFi 名称" data-en="WiFi SSID">WiFi 名称</label><span id='info-ssid'>-</span></div>
<div class='info-item'><label data-zh="WiFi 信号" data-en="WiFi RSSI">WiFi 信号</label><span id='info-rssi'>-</span></div>
<div class='info-item'><label data-zh="WiFi 信道" data-en="WiFi Channel">WiFi 信道</label><span id='info-chan'>-</span></div>
<div class='info-item'><label data-zh="WiFi 模式" data-en="WiFi PHY">WiFi 模式</label><span id='info-phy'>-</span></div>
<div class='info-item' style='grid-column:1/-1'><label data-zh="接入点 MAC" data-en="WiFi BSSID">接入点 MAC</label><span id='info-bssid'>-</span></div>
</div>
<div class='actions'><button class='btn btn-danger' onclick='restart()' data-zh="重启设备" data-en="Restart Device">重启设备</button></div>
</div>
<div class='card'><h2 data-zh="系统日志" data-en="System Logs">系统日志</h2>
<p style='color:#888;font-size:13px;margin-bottom:12px' data-zh="通过 WebSocket 实时查看 ESP 日志" data-en="Live ESP log output via WebSocket">通过 WebSocket 实时查看 ESP 日志</p>
<a href='/logs' class='btn btn-primary' data-zh="打开日志" data-en="Open Log Viewer">打开日志</a></div>
<div class='card'><h2 data-zh="WiFi 测速" data-en="WiFi Speedtest">WiFi 测速</h2>
<p style='color:#888;font-size:13px;margin-bottom:12px' data-zh="测试到本设备的延迟与吞吐" data-en="Measure latency and throughput to this device">测试到本设备的延迟与吞吐</p>
<a href='/speedtest' class='btn btn-primary' data-zh="开始测速" data-en="Open Speedtest">开始测速</a></div>
</div>
<script>
var uiLanguage=localStorage.getItem('airplay-language')==='en'?'en':'zh';
function tr(zh,en){return uiLanguage==='en'?en:zh;}
function applyLanguage(){
 document.documentElement.lang=uiLanguage==='en'?'en':'zh-CN';
 document.querySelectorAll('[data-zh]').forEach(function(e){e.textContent=e.dataset[uiLanguage];});
 document.querySelectorAll('[data-placeholder-zh]').forEach(function(e){e.placeholder=e.dataset[uiLanguage==='en'?'placeholderEn':'placeholderZh'];});
 document.getElementById('ui-language').value=uiLanguage;
 applyChanLabels();renderSavedWiFi();renderOTAStatus();loadInfo();
 var f=(document.getElementById('fw-file').files||[])[0];if(f)document.getElementById('fw-name').textContent=f.name;
}

function msg(id,txt,type){var e=document.getElementById(id);if(e){e.replaceChildren();var box=document.createElement('div');box.className='msg '+type;box.textContent=txt;e.appendChild(box);setTimeout(function(){e.innerHTML='';},4000);}}
var savedWiFi=[],scannedNetworks=null,selectedNetwork=null,wifiConnecting=false,currentWiFiInfo=null,currentWiFiInfoAt=0;
function wifiMessage(text,type){var box=document.createElement('div');box.className='msg '+type;box.textContent=text;document.getElementById('wifi-msg').replaceChildren(box);}
function renderWiFiCurrent(){var e=document.getElementById('wifi-current');e.textContent=currentWiFiInfo?(currentWiFiInfo.wifi_connected?tr('当前已连接：','Currently connected: ')+currentWiFiInfo.wifi_ssid:tr('WiFi 未连接','WiFi is not connected')):tr('连接状态暂不可读','Connection status is unavailable');}
function networkIsConnected(n){if(currentWiFiInfo)return !!currentWiFiInfo.wifi_connected&&!!n.bssid&&String(n.bssid).toLowerCase()===String(currentWiFiInfo.wifi_bssid||'').toLowerCase();return !!n.connected;}
function renderScanNetworks(){
  if(scannedNetworks===null)return;
  var list=document.getElementById('wifi-list');list.replaceChildren();
  if(!scannedNetworks.length){var empty=document.createElement('div');empty.className='msg info';empty.textContent=tr('未发现网络','No networks found');list.appendChild(empty);return;}
  scannedNetworks.forEach(function(n){
    var item=document.createElement('button');item.type='button';item.className='wifi-item';item.disabled=!n.ssid;item.title=n.bssid||'';
    if(selectedNetwork&&n.bssid===selectedNetwork.bssid&&n.ssid===selectedNetwork.ssid)item.classList.add('sel');
    var details=document.createElement('span');details.className='wifi-details';var name=document.createElement('span');name.className='ssid';name.textContent=n.ssid||tr('隐藏网络（请手动输入）','Hidden network (enter manually)');
    var meta=document.createElement('span');meta.className='wifi-meta';var labels=[n.secure===false?tr('开放网络','Open network'):tr('需要密码','Password required')];
    if(networkIsConnected(n))labels.push(tr('已连接','Connected'));if(savedWiFi.indexOf(n.ssid)>=0)labels.push(tr('已保存','Saved'));meta.textContent=labels.join(' · ');details.append(name,meta);
    var signal=document.createElement('span');signal.className='rssi';signal.textContent=n.rssi+' dBm';item.append(details,signal);item.onclick=function(){openWiFiPanel(n);};list.appendChild(item);
  });
}
function renderSavedWiFi(){var sel=document.getElementById('saved-wifi');var previous=sel.value;sel.replaceChildren();var placeholder=document.createElement('option');placeholder.value='';placeholder.textContent=savedWiFi.length?tr('请选择已保存的网络','Select a saved network'):tr('暂无已保存的网络','No saved networks');sel.appendChild(placeholder);savedWiFi.forEach(function(ssid){var opt=document.createElement('option');opt.value=ssid;opt.textContent=ssid;sel.appendChild(opt);});sel.value=previous;document.getElementById('saved-wifi-connect').disabled=wifiConnecting||!sel.value;sel.onchange=function(){document.getElementById('saved-wifi-connect').disabled=wifiConnecting||!this.value;};renderScanNetworks();updateWiFiPasswordPanel();renderWiFiCurrent();}
async function loadSavedWiFi(){try{var r=await fetch('/api/wifi/saved',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);var d=await r.json();if(d.success&&Array.isArray(d.networks)){savedWiFi=d.networks.filter(function(n){return typeof n==='string';});renderSavedWiFi();}}catch(e){wifiMessage(tr('无法读取已保存网络','Could not load saved networks'),'err');}}
function openWiFiPanel(n){if(wifiConnecting||!n.ssid)return;selectedNetwork=n;document.getElementById('wifi-ssid').value=n.ssid;document.getElementById('wifi-selected-password').value='';document.getElementById('wifi-reuse').checked=savedWiFi.indexOf(n.ssid)>=0;document.getElementById('wifi-connect-panel').hidden=false;document.getElementById('wifi-msg').replaceChildren();updateWiFiPasswordPanel();renderScanNetworks();document.getElementById('wifi-connect-panel').scrollIntoView({block:'nearest',behavior:'smooth'});if(!document.getElementById('wifi-selected-password').disabled)document.getElementById('wifi-selected-password').focus();else document.getElementById('wifi-selected-connect').focus();}
function updateWiFiPasswordPanel(){if(!selectedNetwork)return;var saved=savedWiFi.indexOf(selectedNetwork.ssid)>=0;var reuse=document.getElementById('wifi-reuse');if(!saved)reuse.checked=false;document.getElementById('wifi-reuse-row').hidden=!saved;reuse.disabled=wifiConnecting;var input=document.getElementById('wifi-selected-password');var needsPassword=selectedNetwork.secure!==false&&!reuse.checked;input.disabled=!needsPassword||wifiConnecting;document.getElementById('wifi-selected-password-group').hidden=!needsPassword;document.getElementById('wifi-selected-name').textContent=selectedNetwork.ssid;document.getElementById('wifi-selected-hint').textContent=reuse.checked?tr('将使用设备中保存的密码，无需再次输入。','Uses the password saved on this device. No need to enter it again.'):selectedNetwork.secure===false?tr('这是开放网络，无需密码。','This is an open network. No password is needed.'):tr('输入密码，然后点击连接。','Enter the password, then tap Connect.');}
function closeWiFiPanel(){if(wifiConnecting)return;selectedNetwork=null;document.getElementById('wifi-connect-panel').hidden=true;document.getElementById('wifi-selected-password').value='';renderScanNetworks();}
function setWiFiConnecting(busy){wifiConnecting=busy;['wifi-selected-connect','wifi-selected-cancel','wifi-manual-connect','wifi-scan'].forEach(function(id){document.getElementById(id).disabled=busy;});document.getElementById('saved-wifi-connect').disabled=busy||!document.getElementById('saved-wifi').value;updateWiFiPasswordPanel();}
function validWiFiSSID(ssid){var length=new TextEncoder().encode(ssid).length;return length>=1&&length<=32&&ssid.indexOf('\0')<0;}
function validWiFiPassword(password){var length=new TextEncoder().encode(password).length;return password.indexOf('\0')<0&&(length===0||(length>=8&&length<=63)||/^[0-9a-fA-F]{64}$/.test(password));}
async function waitForWiFiConnection(ssid,baseline,baselineAt,started){
  for(var attempt=0;attempt<15;attempt++){
    await new Promise(function(resolve){setTimeout(resolve,3000);});
    var info=await loadInfo(2500);if(!info)continue;
    var sameDevice=!baseline||!baseline.mac||info.mac===baseline.mac;
    var expectedUptime=baseline?baseline.uptime_s+(Date.now()-baselineAt)/1000:(Date.now()-started)/1000+1;
    var rebooted=typeof info.uptime_s==='number'&&info.uptime_s<expectedUptime-1;
    if(sameDevice&&rebooted&&info.wifi_connected&&info.wifi_ssid===ssid){wifiMessage(tr('已连接：','Connected: ')+ssid,'ok');await loadSavedWiFi();return true;}
  }
  wifiMessage(tr('已保存，但连接尚未确认。若设备换了 IP，请重新打开设备地址；请检查密码及网络是否可用。','Saved, but connection is unconfirmed. If the IP changed, reopen the device address. Check the password and network availability.'),'err');return false;
}
async function submitWiFiConnection(payload){
  if(wifiConnecting)return false;
  if(!validWiFiSSID(payload.ssid)){wifiMessage(tr('网络名称须为 1–32 字节','Network name must be 1–32 bytes'),'err');return false;}
  if(!payload.use_saved&&!validWiFiPassword(payload.password)){wifiMessage(tr('密码须为 8–63 字节或 64 位十六进制；开放网络可留空','Password must be 8–63 bytes or 64 hexadecimal digits; leave empty for an open network'),'err');return false;}
  setWiFiConnecting(true);var controller=new AbortController();var timeout;
  try{var baseline=await loadInfo(2500);var baselineAt=currentWiFiInfoAt;var started=Date.now();timeout=setTimeout(function(){controller.abort();},15000);
    var r=await fetch('/api/wifi/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:controller.signal});var d;
    try{d=await r.json();}catch(e){if(e.name==='AbortError')throw e;throw new Error(tr('响应格式错误','Invalid response')+' (HTTP '+r.status+')');}
    if(!r.ok||!d.success)throw new Error(d.error||'HTTP '+r.status);
    clearTimeout(timeout);document.getElementById('wifi-selected-password').value='';document.getElementById('wifi-pass').value='';
    wifiMessage(tr('已保存，正在重启连接…正在等待设备确认。换网后设备地址可能改变。','Saved. Restarting to connect... Waiting for device confirmation. The device address may change after switching networks.'),'info');
    return await waitForWiFiConnection(payload.ssid,baseline,baselineAt,started);
  }catch(e){wifiMessage(tr('连接未确认：','Connection unconfirmed: ')+(e.name==='AbortError'?tr('请求超时，请重新读取设备状态','Request timed out. Check device status again'):e.message),'err');return false;}
  finally{clearTimeout(timeout);setWiFiConnecting(false);}
}
async function connectSelectedWiFi(){if(!selectedNetwork||wifiConnecting)return;var ssid=selectedNetwork.ssid;var reuse=document.getElementById('wifi-reuse').checked&&savedWiFi.indexOf(ssid)>=0;var password=selectedNetwork.secure===false?'':document.getElementById('wifi-selected-password').value;if(!reuse&&selectedNetwork.secure!==false&&!password){wifiMessage(tr('请输入此网络的密码','Enter this network’s password'),'err');document.getElementById('wifi-selected-password').focus();return;}await submitWiFiConnection(reuse?{ssid:ssid,use_saved:true}:{ssid:ssid,password:password});}

async function scanWiFi(){
  var l=document.getElementById('wifi-list');var btn=document.getElementById('wifi-scan');
  if(btn.disabled||wifiConnecting)return;
  btn.disabled=true;scannedNetworks=null;
  function showScanMessage(text,type){var box=document.createElement('div');box.className='msg '+type;box.textContent=text;l.replaceChildren(box);}
  showScanMessage(tr('扫描中…','Scanning...'),'info');
  var controller=new AbortController();var timeout=setTimeout(function(){controller.abort();},20000);
  try{var r=await fetch('/api/wifi/scan',{cache:'no-store',signal:controller.signal});var d;
    try{d=await r.json();}catch(e){if(e.name==='AbortError')throw e;throw new Error(tr('响应格式错误','Invalid response')+' (HTTP '+r.status+')');}
    if(!r.ok||!d.success){var error=d.error||'HTTP '+r.status;
      if(error==='ESP_ERR_WIFI_STATE')error=tr('WiFi 正忙或正在连接，请稍后重试','WiFi is busy or connecting. Try again shortly')+' ('+error+')';
      else if(error==='ESP_ERR_WIFI_TIMEOUT'||error==='ESP_ERR_TIMEOUT')error=tr('设备扫描超时，请重试','Device scan timed out. Try again')+' ('+error+')';
      throw new Error(error);}
    if(!Array.isArray(d.networks))throw new Error(tr('响应缺少网络列表','Response is missing the network list'));
    scannedNetworks=d.networks;renderScanNetworks();
  }catch(e){var detail=e.name==='AbortError'?tr('请求超时，请重试','Request timed out. Try again'):e.message;showScanMessage(tr('扫描失败：','Scan failed: ')+detail,'err');}
  finally{clearTimeout(timeout);btn.disabled=wifiConnecting;}}

var otaBusy=false,otaStatus=null;
var OTA_UPLOAD_TIMEOUT=180000,OTA_VERIFY_TIMEOUT=90000,OTA_POLL_INTERVAL=2000;
function otaMessage(zh,en,type){otaStatus={zh:zh,en:en,type:type};renderOTAStatus();}
function otaError(zh,en){var e=new Error(tr(zh,en));e.otaZh=zh;e.otaEn=en;return e;}
function renderOTAStatus(){
  if(!otaStatus)return;var e=document.getElementById('ota-msg');e.replaceChildren();
  var box=document.createElement('div');box.className='msg '+otaStatus.type;
  box.textContent=otaStatus[uiLanguage];e.appendChild(box);
}
function setOTABusy(busy){
  otaBusy=busy;document.getElementById('fw-file').disabled=busy;
  document.getElementById('fw-choose').disabled=busy;

}
async function otaReadInfo(timeoutMs){
  var controller=new AbortController();var timer=setTimeout(function(){controller.abort();},timeoutMs);
  try{var r=await fetch('/api/system/info',{cache:'no-store',signal:controller.signal});
    if(!r.ok)return null;var d=await r.json();return d.success&&d.info?d.info:null;
  }catch(e){return null;}finally{clearTimeout(timer);}
}
async function otaImageBytes(file,offset,length){
  var timer;try{
    var data=await Promise.race([file.slice(offset,offset+length).arrayBuffer(),new Promise(function(resolve,reject){
      timer=setTimeout(function(){reject(otaError('读取固件超时','Firmware read timed out'));},5000);
    })]);
    var b=new Uint8Array(data);if(b.length!==length)throw otaError('固件文件不完整','Firmware file is truncated');return b;
  }finally{clearTimeout(timer);}
}
async function validateOTAFirmware(file,info){
  // Check the application image, rather than the filename. Bootloader/factory
  // images have no app descriptor at the start of their first segment.
  if(!Number.isSafeInteger(file.size)||file.size<288||file.size>128*1024*1024)
    throw otaError('固件大小无效；请选择应用 OTA BIN','Invalid size; choose an application OTA BIN');
  if(info&&Number.isSafeInteger(info.ota_partition_size)&&info.ota_partition_size>0&&file.size>info.ota_partition_size)
    throw otaError('固件超过设备 OTA 分区大小','Firmware exceeds this device’s OTA partition');
  var prefix=await otaImageBytes(file,0,288),view=new DataView(prefix.buffer,prefix.byteOffset,prefix.byteLength);
  if(prefix[0]!==0xe9||prefix[1]<1||prefix[1]>16||prefix[23]>1||view.getUint32(32,true)!==0xabcd5432||view.getUint32(28,true)<256)
    throw otaError('不是应用 OTA 镜像；请勿选择合并 / factory BIN','Not an application OTA image; do not select a merged / factory BIN');
  var chipId=view.getUint16(12,true);
  if(chipId===0xffff)throw otaError('固件芯片标识无效','Invalid firmware chip ID');
  // Older firmware may not provide the target ID. Do not guess it from board
  // names or reject a supported chip using a hardcoded model whitelist.
  if(info&&Number.isInteger(info.image_chip_id)&&info.image_chip_id>=0&&info.image_chip_id<=0xfffe&&chipId!==info.image_chip_id)
    throw otaError('固件芯片与设备不匹配','Firmware chip does not match this device');
  var version='';for(var v=48;v<80&&prefix[v]!==0;v++){
    if(prefix[v]<32||prefix[v]>126)throw otaError('固件版本字段无效','Invalid firmware version field');
    version+=String.fromCharCode(prefix[v]);
  }
  if(!version.trim()||v===80)throw otaError('固件缺少有效版本','Firmware has no valid version');
  var offset=24;
  for(var s=0;s<prefix[1];s++){
    if(offset+8>file.size)throw otaError('固件文件不完整','Firmware file is truncated');
    var header=s===0?prefix.subarray(24,32):await otaImageBytes(file,offset,8);
    var length=new DataView(header.buffer,header.byteOffset,8).getUint32(4,true);
    if(length>file.size-offset-8)throw otaError('固件段长度无效','Invalid firmware segment length');
    offset+=8+length;
  }
  // One checksum byte occupies the last byte of the next 16-byte boundary.
  // A factory image or appended second image must not pass as an app image.
  var expected=(Math.floor(offset/16)+1)*16+(prefix[23]===1?32:0);
  if(expected!==file.size)throw otaError('固件不完整或包含额外镜像；请选择应用 OTA BIN','Truncated or combined image; choose an application OTA BIN');
  return {version:version,chipId:chipId,size:file.size};
}
function otaRebootObserved(before,now){
  if(typeof before.boot_id==='string'&&before.boot_id)
    return typeof now.boot_id==='string'&&!!now.boot_id&&before.boot_id!==now.boot_id;
  // app_desc describes the running application; a changed version proves a
  // new application has booted even when upgrading an older API without ID.
  if(typeof before.firmware_version==='string'&&before.firmware_version&&typeof now.firmware_version==='string'&&now.firmware_version!==before.firmware_version)return true;
  // An offline request or zero uptime alone is not proof of a same-version
  // reboot. Allow old APIs only when positive uptime dropped beyond rounding.
  return Number.isFinite(before.uptime_s)&&before.uptime_s>0&&Number.isFinite(now.uptime_s)&&now.uptime_s>0&&
    now.uptime_s+2<before.uptime_s;
}
function otaSameDevice(before,now){
  return !before.mac||(typeof now.mac==='string'&&String(before.mac).toLowerCase()===now.mac.toLowerCase());
}
async function otaPageMatches(version,timeoutMs){
  var controller=new AbortController(),timer=setTimeout(function(){controller.abort();},timeoutMs);
  try{var r=await fetch('/',{cache:'no-store',signal:controller.signal});
    var matches=r.ok&&r.headers.get('X-WebUI-Version')===version&&r.headers.get('X-WebUI-Source')==='embedded';
    await r.text();return matches;
  }catch(e){return false;}finally{clearTimeout(timer);}
}
async function verifyOTA(image,before){
  var deadline=Date.now()+OTA_VERIFY_TIMEOUT,consecutive=0,last=null;
  var reason={zh:'设备尚未返回',en:'Device has not returned'};
  while(Date.now()<deadline){
    await new Promise(function(resolve){setTimeout(resolve,Math.min(OTA_POLL_INTERVAL,Math.max(1,deadline-Date.now())));});
    if(Date.now()>=deadline)break;
    var info=await otaReadInfo(Math.min(4000,Math.max(1,deadline-Date.now())));
    if(!info){consecutive=0;last=null;continue;}
    var matches=info.firmware_version===image.version&&info.webui_version===image.version&&info.webui_source==='embedded';
    if(!otaSameDevice(before,info)){reason={zh:'返回的设备身份不同',en:'A different device responded'};consecutive=0;last=null;continue;}
    if(!matches){reason={zh:'固件或内置页面版本尚未匹配',en:'Firmware or embedded WebUI version does not match'};consecutive=0;last=null;continue;}
    if(!otaRebootObserved(before,info)){reason={zh:'尚未确认设备重启',en:'Device restart has not been confirmed'};consecutive=0;last=null;continue;}
    // Two fresh responses avoid confirming an unstable initial boot. With a
    // boot ID, both responses must come from the same new boot.
    var stable=last&&(!info.boot_id||last.boot_id===info.boot_id)&&
      (!Number.isFinite(last.uptime_s)||!Number.isFinite(info.uptime_s)||info.uptime_s>=last.uptime_s);
    consecutive=stable?consecutive+1:1;last=info;
    if(consecutive<2)continue;
    if(Date.now()>=deadline)break;
    if(!await otaPageMatches(image.version,Math.min(4000,Math.max(1,deadline-Date.now())))){
      reason={zh:'实际页面版本或来源尚未匹配',en:'Served WebUI version or source does not match'};consecutive=0;last=null;continue;
    }
    if(Date.now()>=deadline)break;
    otaMessage('已验证：固件与内置页面均为 '+image.version+'，设备已重启。正在刷新页面…',
      'Verified: firmware and embedded WebUI are both '+image.version+'. Device restarted. Refreshing…','ok');
    setTimeout(function(){window.location.replace('/?ui='+encodeURIComponent(image.version)+'&t='+Date.now());},2000);
    return true;
  }
  otaMessage('升级未确认：'+reason.zh+'。请检查设备状态后再重试。','Update unconfirmed: '+reason.en+'. Check the device before retrying.','err');
  return false;
}
async function startOTA(){
  if(otaBusy)return;var file=document.getElementById('fw-file').files[0];
  if(!file){otaMessage('请选择应用 OTA BIN','Select an application OTA BIN','err');return;}
  setOTABusy(true);var verified=false,attempted=false;
  try{
    otaMessage('检查固件与设备信息…','Checking firmware and device information…','info');
    var before=await otaReadInfo(6000);
    if(!before||typeof before.firmware_version!=='string'||!before.firmware_version)
      throw otaError('无法读取设备信息，未上传，请重试','Cannot read device information; nothing uploaded. Retry.');
    var image=await validateOTAFirmware(file,before);
    otaMessage('上传 '+image.version+'（'+Math.round(image.size/1024)+' KB）…','Uploading '+image.version+' ('+Math.round(image.size/1024)+' KB)…','info');
    var controller=new AbortController(),timer=setTimeout(function(){controller.abort();},OTA_UPLOAD_TIMEOUT),uncertain=false;
    try{
      // Preserve the raw POST interface supported by earlier firmware.
      attempted=true;
      var response=await fetch('/api/ota/update',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file,signal:controller.signal});
      if(!response.ok){var details='';try{details=(await response.text()).slice(0,240);}catch(e){}
        otaMessage('上传失败：HTTP '+response.status+(details?' — '+details:''),'Upload failed: HTTP '+response.status+(details?' — '+details:''),'err');return;}
      await response.text();
    }catch(e){uncertain=true;}finally{clearTimeout(timer);}
    otaMessage(uncertain?'上传响应中断，正在核对重启及版本…':'上传已接受，等待设备重启并核对版本…',
      uncertain?'Upload response interrupted; checking restart and versions…':'Upload accepted; waiting for restart and checking versions…','info');
    verified=await verifyOTA(image,before);
  }catch(e){otaMessage((attempted?'升级未确认：':'未上传：')+(e.otaZh||e.message),(attempted?'Update unconfirmed: ':'Not uploaded: ')+(e.otaEn||e.message),'err');}
  finally{if(!verified)setOTABusy(false);}
}
async function restart(){
  if(!confirm(tr("确定重启设备？","Restart the device?")))return;
  try{await fetch('/api/system/restart',{method:'POST'});msg('',tr("重启中…","Restarting..."),'info');}catch(e){}}
async function loadInfo(timeoutMs){
  if(otaBusy)return null;
  var controller=new AbortController();var timeout=setTimeout(function(){controller.abort();},typeof timeoutMs==='number'?timeoutMs:6000);
  try{var r=await fetch('/api/system/info',{cache:'no-store',signal:controller.signal});var d=await r.json();
    if(!r.ok||!d.success)return null;
    var i=d.info;currentWiFiInfo=i;currentWiFiInfoAt=Date.now();renderWiFiCurrent();renderScanNetworks();var b=document.getElementById('status-bar');
      if(i.eth_connected){b.className='status-bar ok';b.textContent=tr('有线网络: ','Ethernet: ')+i.ip;}
      else if(i.wifi_connected){b.className='status-bar ok';b.textContent=tr('WiFi 已连接: ','WiFi connected: ')+i.ip;}
      else{b.className='status-bar err';b.textContent=tr('未连接，请在下方配置 WiFi','Not connected — configure WiFi below');}
      document.getElementById('info-ip').textContent=i.ip||'-';
      document.getElementById('info-mac').textContent=i.mac||'-';
      document.getElementById('info-name').textContent=i.device_name||'-';
      document.getElementById('info-heap').textContent=Math.round(i.free_heap/1024)+' KB';
      document.getElementById('info-fw').textContent=i.firmware_version?i.firmware_version+' by cedric':'-';
      document.getElementById('info-webui').textContent=i.webui_version||'-';
      function fmtUptime(s){if(s==null)return '-';var d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
        return (d?d+'d ':'')+(d||h?h+'h ':'')+m+'m '+(s%60)+'s';}
      document.getElementById('info-uptime').textContent=fmtUptime(i.uptime_s);
      document.getElementById('info-reset').textContent=i.reset_reason||'-';
      function rssiLabel(r){if(r==null)return '-';var q='';if(r>=-55)q=tr(' (优秀)',' (excellent)');else if(r>=-65)q=tr(' (良好)',' (good)');else if(r>=-75)q=tr(' (一般)',' (fair)');else q=tr(' (较差)',' (poor)');return r+' dBm'+q;}
      document.getElementById('info-ssid').textContent=i.wifi_ssid||'-';
      document.getElementById('info-rssi').textContent=rssiLabel(i.wifi_rssi);
      document.getElementById('info-chan').textContent=i.wifi_channel||'-';
      document.getElementById('info-phy').textContent=i.wifi_phy||'-';
      document.getElementById('info-bssid').textContent=i.wifi_bssid||'-';
      if(i.eq_supported||i.sub_supported){document.getElementById('eq-link').style.display='';}
      /* Only a TAS58xx build registers /api/audio/dual; asking anyway logs a
         warning on the device for every page load. */
      if(i.dual_supported&&!dualLoaded){dualLoaded=true;loadDual();}
      document.getElementById('dev-name').placeholder=i.device_name||'';return i;
  }catch(e){if(wifiConnecting){currentWiFiInfo=null;if(scannedNetworks)scannedNetworks.forEach(function(n){n.connected=false;});renderWiFiCurrent();renderScanNetworks();}return null;}
  finally{clearTimeout(timeout);}}
window.onload=function(){applyLanguage();document.getElementById('ui-language').onchange=function(){uiLanguage=this.value;localStorage.setItem('airplay-language',uiLanguage);applyLanguage();};
  document.getElementById('fw-file').onchange=function(e){var f=e.target.files[0];
    document.getElementById('fw-name').textContent=f?f.name:tr("未选择文件","No file selected");
    document.getElementById('ota-btn').disabled=otaBusy||!f;};
  loadIcon();loadSavedWiFi();loadInfo();loadBrightness();loadChannel();setInterval(loadInfo,30000);};
</script></body></html>
